<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Страница обо мне</title>
    <style>
        #main {
            width: 100%;
            max-width: 710px;
            margin: 0px auto;
            border: 3px solid #edc7ff;
        }
        #header {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 3px solid #fff7c7;
        }
        #photo {
            width: 100%;
            max-width: 450px;
            height: 350px;
            margin: 0 auto;
        }
        #text {
            width: 100%;
            max-width: 255px;
            margin: 0 auto;
            text-indent: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #footer {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 3px solid #fff7c7;
            text-align: center;
            font-size: 14px;
        }
        #text, #photo {
            background: #c7eaff;
        }
        #header, #footer {
            background: #ffdbc7;
        }
        img {
            object-fit: cover;
            object-position: center;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="header">
            <h1>Hello, World!</h1>
        </div>
        <div id="photo">
            <img src="photo1.jpg" alt="Мое фото">
        </div>
        <div id="text">
            <h3>Рафаэл Лисин</h3>
        </div>
        <div id="footer">
            <p>Связаться по <a href="mailto:rafaellisin@gmail.com">почте</a> или через <a href="https://vk.com/">сеть</a></p>
        </div>
    </div>
</body>
</html>
